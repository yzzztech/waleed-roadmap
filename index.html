<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>خارطة تطوير مهني — وليد زيدان</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#e0e0e0;font-family:Tahoma,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.7;overflow-x:hidden}
.particles{position:fixed;inset:0;pointer-events:none;z-index:0}
nav{position:sticky;top:0;z-index:100;background:rgba(10,10,26,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);padding:12px 16px;display:flex;gap:10px;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;-webkit-overflow-scrolling:touch}
nav a{color:#8888a0;text-decoration:none;font-size:14px;transition:color .2s;padding:5px 10px;border-radius:8px;white-space:nowrap;flex-shrink:0}
nav a:hover{color:#00d4ff;background:rgba(0,212,255,0.06)}
.container{max-width:1100px;margin:0 auto;padding:16px;position:relative;z-index:1}
.hero{text-align:center;padding:60px 8px 40px;position:relative}
.hero::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(600px,80vw);height:min(600px,80vw);background:radial-gradient(circle,rgba(0,212,255,0.08) 0%,transparent 70%);pointer-events:none}
.hero-avatar{width:120px;height:120px;border-radius:50%;border:3px solid rgba(0,212,255,0.4);object-fit:cover;margin-bottom:16px;box-shadow:0 0 40px rgba(0,212,255,0.2)}.hero h1{font-size:clamp(28px,6vw,52px);font-weight:900;background:linear-gradient(135deg,#fff 30%,#00d4ff 70%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px}
.hero .sub{font-size:clamp(15px,2.5vw,20px);color:#8888a0;max-width:650px;margin:0 auto 20px;padding:0 12px}
.hero .badge-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.badge{background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.2);border-radius:50px;padding:6px 14px;font-size:13px;color:#00d4ff;white-space:nowrap}
.section-title{font-size:clamp(22px,4vw,32px);font-weight:700;margin:50px 0 24px;padding-bottom:12px;border-bottom:2px solid rgba(0,212,255,0.15);display:flex;align-items:center;gap:10px}
.section-title .icon{font-size:clamp(24px,4vw,36px)}
.summary-card{background:rgba(18,17,59,0.4);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:24px 20px;margin-bottom:40px}
.summary-card h3{font-size:clamp(18px,3vw,22px);color:#00d4ff;margin-bottom:12px}
.summary-card p{color:#b0b0c0;font-size:clamp(14px,2vw,16px);line-height:1.9}
.course-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:16px;margin-bottom:32px}
.course-card{background:rgba(18,17,59,0.5);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.06);border-radius:18px;overflow:hidden;transition:transform .3s,border-color .3s;cursor:pointer}
.course-card:hover{transform:translateY(-4px);border-color:rgba(0,212,255,0.3)}
.course-card.gold{border-color:rgba(255,215,0,0.25)}
.course-card.gold:hover{border-color:rgba(255,215,0,0.5);box-shadow:0 0 30px rgba(255,215,0,0.1)}
.course-header{padding:18px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,0.04)}
.course-header .rank{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;flex-shrink:0}
.rank-1{background:linear-gradient(135deg,#ffd700,#c9a000);color:#0a0a1a}
.rank-2{background:linear-gradient(135deg,#c0c0c0,#808080);color:#0a0a1a}
.rank-3{background:linear-gradient(135deg,#cd7f32,#8b5a2b);color:#fff}
.rank-n{background:rgba(0,212,255,0.2);color:#00d4ff}
.course-header h3{font-size:clamp(16px,2.5vw,20px);color:#fff;line-height:1.3}
.course-header .provider{font-size:13px;color:#8888a0;margin-top:3px}
.course-body{padding:0 20px;max-height:0;overflow:hidden;transition:max-height .6s ease,padding .6s ease}
.course-card.open .course-body{max-height:none;padding:20px;overflow:visible}
.course-body h4{font-size:15px;color:#00d4ff;margin:12px 0 5px}
.course-body p,.course-body li{font-size:14px;color:#a0a0b8;line-height:1.8}
.course-body a{color:#00d4ff;text-decoration:underline;text-underline-offset:3px}
.course-body a:hover{color:#fff}
.expand-hint{text-align:center;color:#8888a0;font-size:12px;padding:6px 20px 12px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:20px 0}
table{width:100%;border-spacing:0 6px;border-collapse:separate;min-width:500px}
thead th{text-align:right;color:#8888a0;font-size:13px;font-weight:500;padding:0 12px 8px}
tbody td{background:rgba(18,17,59,0.3);padding:12px;font-size:14px;color:#c0c0d0}
tbody tr td:first-child{border-radius:0 10px 10px 0;font-weight:600;color:#fff;white-space:nowrap}
tbody tr td:last-child{border-radius:10px 0 0 10px}
tbody tr:hover td{background:rgba(0,212,255,0.06)}
.footer{text-align:center;padding:50px 20px 30px;color:#555;font-size:13px;border-top:1px solid rgba(255,255,255,0.04);margin-top:40px}
@keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(255,215,0,0.1)}50%{box-shadow:0 0 40px rgba(255,215,0,0.25)}}
.pulse{animation:pulse 3s infinite}
.timeline-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:20px 0;padding:16px 0}
.timeline{display:flex;gap:0;min-width:700px;padding:12px 4px}
.timeline-item{flex:1;min-width:100px;text-align:center;position:relative;padding:20px 6px 0}
.timeline-item::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:#00d4ff}
.timeline-item::after{content:'';position:absolute;top:4px;left:50%;width:100%;height:2px;background:rgba(0,212,255,0.2)}
.timeline-item:last-child::after{display:none}
.timeline-item .yr{font-size:11px;color:#8888a0}
.timeline-item .role{font-size:12px;color:#e0e0e0;font-weight:600;margin-top:4px}
.timeline-item .co{font-size:11px;color:#00d4ff;margin-top:2px}
</style></head><body><canvas class="particles" id="particles"></canvas>
